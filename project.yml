name: ClimCorse
options:
  bundleIdPrefix: com.vincentlauriat
  deploymentTarget:
    macOS: "14.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.1"

schemes:
  ClimCorse:
    build:
      targets:
        ClimCorse: all
    run:
      config: Debug

targets:
  ClimCorse:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ClimCorse
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: ClimCorse
        PRODUCT_BUNDLE_IDENTIFIER: com.vincentlauriat.climcorse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: ClimCorse/ClimCorse.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
    info:
      path: ClimCorse/Info.plist
      properties:
        CFBundleName: ClimCorse
        CFBundleDisplayName: ClimCorse
        CFBundleIdentifier: com.vincentlauriat.climcorse
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "© 2026 Vincent Lauriat"
        SUFeedURL: "https://raw.githubusercontent.com/vincentlauriat/ClimCorse/main/appcast.xml"
        # Moitié publique de la clé EdDSA générée le 2026-08-11, dont la moitié
        # privée vit dans le trousseau sous le compte « ClimCorse ».
        # NE JAMAIS la changer : toute app déjà installée refuserait les mises
        # à jour signées avec une autre clé.
        SUPublicEDKey: "NliHXU9oXogFupZWheoNI67G22h5WoCayAugdzEkyQ4="
        SUEnableAutomaticChecks: true
        # Le scheme de redirection OAuth de l'app Android Comfort Cloud.
        # Nécessaire pour que ASWebAuthenticationSession capte le callback.
        CFBundleURLTypes:
          - CFBundleURLName: com.vincentlauriat.climcorse.oauth
            CFBundleURLSchemes:
              - panasonic-iot-cfc
